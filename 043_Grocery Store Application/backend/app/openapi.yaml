openapi: 3.1.0
info:
  title: Grocery Store Management API
  version: 1.0.0
  description: |
    REST API for products, orders and sales statistics of the Grocery Store Management System.

    * Request and response bodies are JSON (`Content-Type: application/json`).
    * Money values are numbers with 2 decimals. Order prices and totals are always calculated
      by the server from the product prices; clients only send product ids and quantities.
    * Errors use [RFC 9457 problem details](https://www.rfc-editor.org/rfc/rfc9457)
      (`Content-Type: application/problem+json`).

    **Authentication:** sign in with `POST /auth/login`. The server sets an HttpOnly session cookie
    (`freshcart_session`) that the browser sends with every request. All endpoints except login/logout
    require it (`401` otherwise). Roles: **admin** can do everything; **cashier** can sell, and view
    products and orders (`403` for the rest). Five wrong passwords lock an account for 5 minutes (`429`).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Authentication
  - name: Users
    description: Staff accounts (admin only)
  - name: Units
  - name: Products
  - name: Orders
  - name: Statistics

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, examples: [admin]}
                password: {type: string, format: password}
      responses:
        '200':
          description: Signed in. Sets the session cookie.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: The account is disabled
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429':
          description: Too many failed attempts; the account is locked for a few minutes
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Sign out
      operationId: logout
      security: []
      responses:
        '204': {description: Signed out}

  /auth/me:
    get:
      tags: [Authentication]
      summary: The signed-in user
      operationId: getMe
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /auth/password:
    put:
      tags: [Authentication]
      summary: Change your own password
      description: Other sessions of this user are signed out; the current one continues.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, format: password}
                new_password: {type: string, format: password, minLength: 8, maxLength: 128}
      responses:
        '204': {description: Changed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /users:
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/User'}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Users]
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewUser'}
      responses:
        '201':
          description: Created
          headers:
            Location: {description: URL of the new user, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /users/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      tags: [Users]
      summary: Get a user
      operationId: getUser
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Users]
      summary: Update a user
      description: |
        Change name, role and active state, and optionally reset the password (which also lifts a sign-in lock).
        Deactivating a user ends their sessions immediately. You cannot remove your own admin rights.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdate'}
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /uoms:
    get:
      tags: [Units]
      summary: List units of measure
      operationId: listUoms
      responses:
        '200':
          description: All units
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Uom'}}

  /products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      responses:
        '200':
          description: All products, sorted by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Product'}}
    post:
      tags: [Products]
      summary: Create a product (admin)
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '201':
          description: Created
          headers:
            Location: {description: URL of the new product, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}

  /products/{productId}:
    parameters:
      - {name: productId, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      tags: [Products]
      summary: Get a product
      operationId: getProduct
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Products]
      summary: Replace a product (admin)
      description: Price changes only affect new orders; existing orders keep the price they were sold at.
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '200':
          description: The updated product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Products]
      summary: Delete a product (admin)
      operationId: deleteProduct
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The product is part of existing orders and cannot be deleted
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /orders:
    get:
      tags: [Orders]
      summary: List orders, newest first
      operationId: listOrders
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - name: q
          in: query
          description: Search by customer name, or by order number (`12` or `#12`)
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: One page of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Order'}}
                  total: {type: integer, description: Number of orders matching the search}
                  limit: {type: integer}
                  offset: {type: integer}
        '400': {$ref: '#/components/responses/BadRequest'}
    post:
      tags: [Orders]
      summary: Create an order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
      responses:
        '201':
          description: Created
          headers:
            Location: {description: URL of the new order, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get an order with its items
      operationId: getOrder
      parameters:
        - {name: orderId, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '404': {$ref: '#/components/responses/NotFound'}

  /stats/summary:
    get:
      tags: [Statistics]
      summary: Sales summary for the dashboard (admin)
      operationId: getStatsSummary
      parameters:
        - {name: days, in: query, description: 'Period length in days, ending today; compared with the same number of days before', schema: {type: integer, minimum: 1, maximum: 366, default: 30}}
      responses:
        '200':
          description: Totals, daily sales and best-selling products
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}

components:
  schemas:
    Uom:
      type: object
      properties:
        id: {type: integer, examples: [1]}
        name: {type: string, examples: [kg]}
    Product:
      type: object
      properties:
        id: {type: integer, examples: [1]}
        name: {type: string, examples: [Tomato]}
        icon: {type: [string, 'null'], description: Emoji shown for the product, examples: ['🍅']}
        uom_id: {type: integer, examples: [1]}
        uom_name: {type: string, examples: [kg]}
        price_per_unit: {type: number, examples: [1.5]}
        created_at: {type: string, format: date-time}
    ProductInput:
      type: object
      required: [name, uom_id, price_per_unit]
      properties:
        name: {type: string, maxLength: 255, examples: [Tomato]}
        icon: {type: [string, 'null'], maxLength: 16, examples: ['🍅']}
        uom_id: {type: integer, minimum: 1, examples: [1]}
        price_per_unit: {type: number, minimum: 0, multipleOf: 0.01, examples: [1.5]}
    OrderItem:
      type: object
      properties:
        product_id: {type: integer}
        product_name: {type: string}
        product_icon: {type: [string, 'null']}
        uom_name: {type: string}
        quantity: {type: number}
        unit_price: {type: number, description: Price per unit at the time of the order}
        total: {type: number}
    Order:
      type: object
      properties:
        id: {type: integer, examples: [1]}
        customer_name: {type: string, examples: [Alice Johnson]}
        total: {type: number, examples: [5.2]}
        created_at: {type: string, format: date-time}
        created_by: {type: [integer, 'null'], description: Id of the staff member who made the sale}
        created_by_name: {type: [string, 'null']}
        items: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}
    OrderInput:
      type: object
      required: [customer_name, items]
      properties:
        customer_name: {type: string, maxLength: 255, examples: [Alice Johnson]}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: {type: integer, minimum: 1, examples: [1]}
              quantity: {type: number, exclusiveMinimum: 0, multipleOf: 0.01, examples: [2]}
    PeriodTotals:
      type: object
      properties:
        orders: {type: integer}
        revenue: {type: number}
        customers: {type: integer, description: Distinct customer names}
        average_order_value: {type: number}
    StatsSummary:
      type: object
      properties:
        days: {type: integer}
        current: {$ref: '#/components/schemas/PeriodTotals'}
        previous: {$ref: '#/components/schemas/PeriodTotals'}
        product_count: {type: integer}
        daily_sales:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              revenue: {type: number}
              orders: {type: integer}
        top_products:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              icon: {type: [string, 'null']}
              uom_name: {type: string}
              quantity: {type: number}
              revenue: {type: number}
        top_customers:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              orders: {type: integer}
              revenue: {type: number}
              last_order_at: {type: string, format: date-time}
        sales_by_staff:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              role: {type: string}
              orders: {type: integer}
              revenue: {type: number}
        busiest_hours:
          type: array
          description: Order counts per weekday (1 = Monday) and hour (0-23); empty slots are left out
          items:
            type: object
            properties:
              weekday: {type: integer, minimum: 1, maximum: 7}
              hour: {type: integer, minimum: 0, maximum: 23}
              orders: {type: integer}
    User:
      type: object
      properties:
        id: {type: integer}
        username: {type: string, examples: [admin]}
        full_name: {type: string, examples: [Ada Admin]}
        role: {type: string, enum: [admin, cashier]}
        is_active: {type: boolean}
        last_login_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    NewUser:
      type: object
      required: [username, full_name, role, password]
      properties:
        username: {type: string, pattern: '^[a-z0-9._-]{3,50}$', description: Stored in lower case}
        full_name: {type: string, maxLength: 255}
        role: {type: string, enum: [admin, cashier]}
        password: {type: string, format: password, minLength: 8, maxLength: 128}
    UserUpdate:
      type: object
      required: [full_name, role]
      properties:
        full_name: {type: string, maxLength: 255}
        role: {type: string, enum: [admin, cashier]}
        is_active: {type: boolean, default: true}
        password: {type: string, format: password, minLength: 8, maxLength: 128, description: Only to reset the password}
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type: {type: string, examples: [about:blank]}
        title: {type: string, examples: [Bad Request]}
        status: {type: integer, examples: [400]}
        detail: {type: string, examples: ["'name' is required"]}

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: freshcart_session
      description: Set by POST /auth/login

  responses:
    Unauthorized:
      description: Not signed in, or the session has ended
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Your role is not allowed to do this
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    BadRequest:
      description: Invalid input
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Conflicts with existing data (e.g. duplicate name)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnsupportedMediaType:
      description: The body is not sent as application/json
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

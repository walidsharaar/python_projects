<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FreshCart - grocery store management: sales, orders, products and staff.">
    <title>FreshCart</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2316a34a'/%3E%3Cpath d='M15 23a6 6 0 0 1-1-11.9c4.9-.9 6.2-1.4 7.9-3.5.9 1.7 1.7 3.6 1.7 6.9 0 4.7-4.1 8.5-8.6 8.5Z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/app.css">
    <script>
        // Apply a saved theme before the first paint to avoid a flash
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        } catch (e) { /* storage unavailable: follow the system theme */ }
    </script>
</head>
<body>
<!-- Shown until we know whether someone is signed in -->
<div class="boot" id="boot"><span class="brand-mark"><span data-icon="leaf"></span></span></div>

<!-- Sign-in screen (rendered by js/views/login.js) -->
<div id="login" hidden></div>

<div class="app" id="app" hidden>
    <header class="topbar">
        <a class="brand" href="#/"><span class="brand-mark"><span data-icon="leaf"></span></span><span>FreshCart</span></a>
        <div class="topbar-actions">
            <button type="button" class="icon-btn theme-toggle" aria-label="Toggle dark mode"></button>
            <button type="button" class="icon-btn" data-action="logout" aria-label="Sign out"><span data-icon="logout"></span></button>
        </div>
    </header>

    <aside class="sidebar">
        <a class="brand" href="#/">
            <span class="brand-mark"><span data-icon="leaf"></span></span>
            <span class="brand-text">FreshCart<small>Grocery Store Manager</small></span>
        </a>
        <nav class="nav" aria-label="Main">
            <a href="#/dashboard" data-route="dashboard" data-roles="admin"><span data-icon="dashboard"></span><span>Dashboard</span></a>
            <a href="#/sale" data-route="sale"><span data-icon="cart"></span><span>New Sale</span></a>
            <a href="#/orders" data-route="orders"><span data-icon="receipt"></span><span>Orders</span></a>
            <a href="#/products" data-route="products" data-roles="admin"><span data-icon="package"></span><span>Products</span></a>
            <a href="#/users" data-route="users" data-roles="admin"><span data-icon="users"></span><span>Staff</span></a>
        </nav>
        <div class="sidebar-footer">
            <a class="nav-secondary" href="/api/docs" target="_blank" rel="noopener" data-roles="admin"><span data-icon="book"></span><span>API Docs</span></a>
            <button type="button" class="nav-secondary theme-toggle" aria-label="Toggle dark mode"></button>
            <div class="user-card" id="user-card"></div>
        </div>
    </aside>

    <main class="main" id="view" tabindex="-1" aria-live="polite"></main>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
